---
- name: Deploy base configuration
  cisco.ios.ios_config:
    src: "{{ generated_config_dir }}/{{ inventory_hostname }}_base.cfg"

- name: Deploy OSPF configuration
  cisco.ios.ios_config:
    src: "{{ generated_config_dir }}/{{ inventory_hostname }}_ospf.cfg"
  when: ospf is defined

- name: Deploy BGP configuration
  cisco.ios.ios_config:
    src: "{{ generated_config_dir }}/{{ inventory_hostname }}_bgp.cfg"
    save_when: modified
  when: bgp is defined